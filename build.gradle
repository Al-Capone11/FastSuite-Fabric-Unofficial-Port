plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}
version = project.version
group = project.modGroup
base { archivesName = "${fileName}-${mcVersion}" }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    implementation "net.fabricmc:fabric-loader:${loaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:0.160.0+26.2"
    annotationProcessor 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', mcVersion
    inputs.property 'loader_version', loaderVersion
    filesMatching('fabric.mod.json') { expand 'version': project.version, 'minecraft_version': mcVersion, 'loader_version': loaderVersion }
}
jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }



